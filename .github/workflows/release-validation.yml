name: Frontend release validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - mvp-release-hardening-20260907
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_LEGAL_PUBLISHED: 'true'
  NEXT_PUBLIC_ENABLE_OPEN_SIGNUP: 'true'
  NEXT_PUBLIC_ENABLE_REALTIME: 'false'
  NEXT_PUBLIC_ENABLE_MARKDOWN_TURNS: 'false'

jobs:
  release-validation:
    name: frontend-release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Source diff hygiene
        run: git diff --check

      - name: Focused production environment contract
        env:
          NEXT_PUBLIC_SITE_URL: https://web-ci.example.com
          NEXT_PUBLIC_API_URL: https://api-ci.example.com/api/v1
          API_URL: https://api-ci.example.com/api/v1
        run: npm run test:env

      - name: Reverse proxy origin boundary
        run: node --test tests/unit/request-origin.test.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://web-ci.example.com
          NEXT_PUBLIC_API_URL: https://api-ci.example.com/api/v1
          API_URL: https://api-ci.example.com/api/v1
        run: npm run build

      - name: Focused motion and identified-account regression
        run: |
          npx playwright test tests/e2e/pending-indicator.spec.ts --config=playwright.realtime.config.ts
          npx playwright test tests/e2e/no-second-ask.spec.ts --config=playwright.adaptive.config.ts

      - name: Focused navigation accessibility regression
        run: >-
          npx playwright test
          tests/e2e/mobile-contract.spec.ts
          tests/e2e/conversation-rename-accessibility.spec.ts
          --config=playwright.accessibility.config.ts

      - name: Focused auth, logout and legal-race regressions
        run: >-
          npx playwright test
          tests/e2e/auth-zone.spec.ts
          tests/e2e/conversation-bff-reliability.spec.ts
          tests/e2e/portal-signout.spec.ts
          tests/e2e/signup-assent.spec.ts
          tests/e2e/invite-legal-version-race.spec.ts
          tests/e2e/open-signup-legal-version-race.spec.ts
          --config=playwright.bff.config.ts

      - name: Focused safe-error UX regression
        run: >-
          npx playwright test
          tests/e2e/conversation-error-ux.spec.ts
          --config=playwright.base.config.ts

      - name: Playwright discovery
        run: npx playwright test --list

      - name: Release matrix integrity
        run: npm run test:e2e:matrix

      - name: Focused working mobile shell header hotfix
        run: >-
          npx playwright test
          tests/e2e/working-mobile-header.spec.ts
          --config=playwright.accessibility.config.ts
          --project=chromium-desktop

      - name: Upload working-shell mobile review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: working-mobile-header-review-${{ github.run_id }}
          path: test-results/**/hotfix-review-*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Focused anonymous conversation management hotfix
        run: >-
          npx playwright test
          tests/e2e/anonymous-conversation-management.spec.ts
          --config=playwright.base.config.ts

      - name: Upload anonymous management review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anonymous-conversation-management-review-${{ github.run_id }}
          path: test-results/**/hotfix-review-*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Focused mobile responsive polish regression
        run: >-
          npx playwright test
          tests/e2e/mobile-responsive-polish.spec.ts
          --config=playwright.accessibility.config.ts
          --project=chromium-desktop

      - name: Upload mobile responsive review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mobile-responsive-review-${{ github.run_id }}
          path: test-results/**/mobile-review-*.png
          if-no-files-found: error
          retention-days: 3

      - name: Focused arrival responsive contract
        run: >-
          npx playwright test
          tests/e2e/arrival-is-bare.spec.ts
          --config=playwright.base.config.ts

      - name: Focused workspace conversation management regression
        run: >-
          npx playwright test
          tests/e2e/workspace-conversation-management.spec.ts
          --config=playwright.bff.config.ts

      - name: Full Playwright release matrix in Chromium
        run: npm run test:e2e:release

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            release-test-results/
            test-results/
          if-no-files-found: ignore
          retention-days: 1

  website-revisions:
    name: website-revisions-chromium-firefox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npx playwright test --config=playwright.revisions.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-revision-browser-results
          path: test-results/
